// Protobuf types for raft log entry payloads.
//
// These messages are the wire format for `Cmd` variants carried inside
// `LogEntry` (defined in meta.proto).  They are used by the typed
// `AppendV002` streaming RPC to transport log entries between raft peers.
//
// Native Rust counterparts live in `crate::log_entry` and `crate::cmd`;
// conversions are in `crate::log_entry::convert`.

syntax = "proto3";

package meta;

// A meta-service cluster node.
message Node {
  string name = 1;
  string addr = 4;
  uint32 port = 5;
  optional string grpc_api_advertise_address = 3;
  // The `addr:port` where this node's raft TLS listener answers, absent when
  // it has none.
  //
  // It is a whole address rather than a port beside `addr` so that a node can
  // advertise TLS on an interface or a name it does not serve plaintext on,
  // and so that its certificate can be issued for that name.
  //
  // A peer that predates this field drops it while decoding and keeps dialing
  // the plaintext `addr`:`port`, which is what makes the field safe to send
  // into a mixed-version cluster.  Tag 2 is retired; do not reuse it.
  optional string raft_tls_advertise_address = 6;
}

// Add a node to the cluster (Cmd::AddNode).
message CmdAddNode {
  uint64 node_id = 1;
  Node node = 2;
  // If true, overwrite an existing node with the same node_id.
  bool overriding = 3;
}

// Remove a node from the cluster (Cmd::RemoveNode).
message CmdRemoveNode {
  uint64 node_id = 1;
}

// Toggle a state-machine feature flag (Cmd::SetFeature).
// Must be enabled/disabled consistently across all nodes.
message CmdSetFeature {
  string feature = 1;
  bool enable = 2;
}

// Sequence-number precondition for `Cmd::UpsertKV.seq`.
//
// - ge=false: CAS, match seq exactly equal to `value` (value=0 == put-if-absent)
// - ge=true:  match seq >= `value` (e.g. update-existing)
//
// Native `MatchSeq::Any` is equivalent to `ge=true, value=0`
// and is sent as such on the wire.
message MatchSeq {
  // If true, match seq >= value. Otherwise match seq == value.
  bool ge = 1;
  uint64 value = 2;
}

// Upsert (or delete) a single KV pair (Cmd::UpsertKV).
//
// `Operation::AsIs` is deprecated and not transported.
message CmdUpsertKV {
  string key = 1;
  MatchSeq seq = 2;

  // Present => update with these bytes; absent => delete.
  optional bytes value = 3;

  // Absolute expire time since Unix epoch.
  // Treated as milliseconds when > 100_000_000_000, otherwise seconds.
  optional uint64 expire_at = 4;

  // Relative time-to-live in milliseconds (applied at raft-log apply time).
  optional uint64 ttl_ms = 5;
}
